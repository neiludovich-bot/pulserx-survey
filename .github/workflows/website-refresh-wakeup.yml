name: Website refresh scheduler wakeup

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/website-refresh-wakeup.yml]

permissions: {}

concurrency:
  group: website-refresh-wakeup
  cancel-in-progress: false

jobs:
  wake-api:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Wake production API so persisted due jobs are checked
        run: curl --fail --silent --show-error --retry 3 --retry-delay 10 --max-time 30 https://api.pulserx.ai/health
